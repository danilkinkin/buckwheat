name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # JDK 17 is both the Gradle daemon JDK and the toolchain declared in
      # app/build.gradle.kts, so Gradle never has to download a second JDK.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # One invocation so the configuration cache is reused across all tasks.
      # assembleRelease is included on purpose: R8, resource shrinking and the keep rules are
      # only exercised by the release variant, so a debug-only CI would miss those failures.
      - name: Verify
        run: ./gradlew spotlessCheck lintDebug testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
          if-no-files-found: ignore

  # Instrumented tests need an emulator and take far longer than the checks above.
  # Run them on demand with:
  #   ./gradlew connectedDebugAndroidTest
